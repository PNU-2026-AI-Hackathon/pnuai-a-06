<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jjigeukka Mission Admin</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { max-width: 900px; margin: 32px auto; padding: 0 20px; color: #18202a; background: #f7f8fa; }
    nav { display: flex; gap: 8px; margin-bottom: 24px; } nav a { padding: 9px 13px; border-radius: 999px; color: #475569; background: #e8edf4; text-decoration: none; font-size: 14px; font-weight: 700; } nav a.active { color: white; background: #2563eb; }
    h1 { margin-bottom: 8px; } p { color: #687386; }
    form { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; background: white; padding: 22px; border-radius: 16px; box-shadow: 0 4px 20px #18202a12; }
    label { display: grid; gap: 6px; font-size: 13px; font-weight: 700; } .wide { grid-column: 1 / -1; }
    input, select, textarea { box-sizing: border-box; width: 100%; border: 1px solid #d8dee8; border-radius: 8px; padding: 10px; font: inherit; }
    textarea { min-height: 100px; resize: vertical; } button { grid-column: 1 / -1; border: 0; border-radius: 8px; padding: 12px; color: white; background: #2563eb; font-weight: 700; cursor: pointer; }
    #message { min-height: 24px; margin-top: 14px; font-weight: 700; } .hint { font-size: 12px; font-weight: 400; color: #8792a2; }
    @media (max-width: 650px) { form { grid-template-columns: 1fr; } .wide { grid-column: auto; } }
  </style>
</head>
<body>
  <nav><a href="/" class="active">미션 등록</a><a href="/locations">GPS 위치 관리</a><a href="/developer-locations">개발 테스트 위치</a></nav>
  <section id="login-panel">
    <h1>관리자 로그인</h1>
    <p>미션 등록 페이지에 접속하려면 관리자 비밀번호가 필요합니다.</p>
    <form id="login-form">
      <label>비밀번호<input name="password" type="password" autocomplete="current-password" required /></label>
      <button type="submit">접속</button>
    </form>
  </section>
  <section id="admin-panel" hidden>
    <h1>미션 등록</h1>
  <p>로컬 운영용 페이지입니다. 예시 사진은 JPEG 파일로 업로드하세요.</p>
  <form id="mission-form">
    <label>미션 세트<select name="mission_set_id" id="mission-set" required></select></label>
    <label>미션 타입<select name="mission_type" id="mission-type"><option>BASIC</option><option>RARE</option><option>SIDE</option></select></label>
    <label>지역 선택<select name="district_code" id="district-code" required></select></label>
    <label>지역 이름<input name="district_label" id="district-label" placeholder="해운대구" readonly required /></label>
    <label>장소 이름<input name="place_label" placeholder="송정해수욕장" /></label>
    <label>자동 생성 미션 코드<input name="code" id="mission-code" readonly /></label>
    <label class="wide">제목<input name="title" required /></label>
    <label class="wide">내용<textarea name="description" required></textarea></label>
    <label>미션 이모지 PNG <span class="hint">mission-emoji/{코드}_e.png로 자동 저장</span><input name="emoji_file" type="file" accept="image/png" required /></label>
    <label class="wide">예시 사진 <span class="hint">JPEG · app/static/mission-photos/{code}.jpg로 자동 저장</span><input name="target_photo" type="file" accept="image/jpeg" required /></label>
    <button type="submit">미션 등록</button>
  </form>
  <button id="logout" type="button" style="margin-top:12px;background:#64748b">로그아웃</button>
  </section>
  <div id="message"></div>
  <script>
    const form = document.querySelector('#mission-form');
    const loginForm = document.querySelector('#login-form');
    const loginPanel = document.querySelector('#login-panel');
    const adminPanel = document.querySelector('#admin-panel');
    const message = document.querySelector('#message');
    let nextCodes = {};
    let districtLabels = {};
    function showAdmin() { loginPanel.hidden = true; adminPanel.hidden = false; loadOptions(); }
    async function loadOptions() {
      const data = await fetch('/api/options').then(r => r.json());
      nextCodes = data.next_codes;
      districtLabels = Object.fromEntries(data.districts.map(x => [x.code, x.label]));
      document.querySelector('#mission-set').innerHTML = data.mission_sets.map(x => `<option value="${x.id}">${x.theme} · ${x.title}</option>`).join('');
      document.querySelector('#district-code').innerHTML = data.districts.map(x => `<option value="${x.code}">${x.label} (${x.code})</option>`).join('');
      updateCode();
      updateDistrictLabel();
    }
    function updateCode() {
      const set = document.querySelector('#mission-set');
      const type = document.querySelector('#mission-type').value;
      const theme = set.options[set.selectedIndex]?.textContent.split(' · ')[0];
      document.querySelector('#mission-code').value = nextCodes[`${theme}:${type}`] || '';
    }
    function updateDistrictLabel() {
      document.querySelector('#district-label').value = districtLabels[document.querySelector('#district-code').value] || '';
    }
    document.querySelector('#mission-set').addEventListener('change', updateCode);
    document.querySelector('#mission-type').addEventListener('change', updateCode);
    document.querySelector('#district-code').addEventListener('change', updateDistrictLabel);
    loginForm.addEventListener('submit', async event => {
      event.preventDefault();
      const response = await fetch('/api/login', { method: 'POST', body: new FormData(loginForm) });
      const body = await response.json();
      if (response.ok) { message.textContent = ''; showAdmin(); }
      else { message.textContent = body.detail || '로그인 실패'; message.style.color = '#b91c1c'; }
    });
    form.addEventListener('submit', async event => {
      event.preventDefault(); message.textContent = '등록 중...'; message.style.color = '#2563eb';
      const response = await fetch('/api/missions', { method: 'POST', body: new FormData(form) });
      const body = await response.json();
      message.textContent = response.ok ? `${body.code} 등록 완료` : (body.detail || '등록 실패');
      message.style.color = response.ok ? '#15803d' : '#b91c1c';
      if (response.ok) { form.reset(); updateCode(); updateDistrictLabel(); }
    });
    document.querySelector('#logout').addEventListener('click', async () => {
      await fetch('/api/logout', { method: 'POST' }); location.reload();
    });
    fetch('/api/options').then(response => { if (response.ok) showAdmin(); });
  </script>
</body>
</html>
